<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Pipeline funnelling a broad company list down to prioritised partner candidates">
  <rect width="800" height="500" fill="#F5F8FF"/>

  <text x="70" y="70" font-family="monospace" font-size="12" fill="#59647D">RAW FIRM LIST</text>
  <g fill="#FFFFFF" stroke="#E2E8F5">
    <rect x="70" y="90" width="150" height="26" rx="6"/>
    <rect x="70" y="124" width="150" height="26" rx="6"/>
    <rect x="70" y="158" width="150" height="26" rx="6"/>
    <rect x="70" y="192" width="150" height="26" rx="6"/>
    <rect x="70" y="226" width="150" height="26" rx="6"/>
    <rect x="70" y="260" width="150" height="26" rx="6"/>
    <rect x="70" y="294" width="150" height="26" rx="6"/>
    <rect x="70" y="328" width="150" height="26" rx="6"/>
  </g>

  <path d="M235 220 L 295 220" stroke="#0B4FD1" stroke-width="2" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#0B4FD1"/>
    </marker>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1668FF"/>
      <stop offset="1" stop-color="#38D9F0"/>
    </linearGradient>
  </defs>

  <rect x="310" y="150" width="190" height="140" rx="14" fill="#050A16"/>
  <text x="330" y="182" font-family="monospace" font-size="11" fill="#8FA0C0">PROMPT PIPELINE</text>
  <text x="330" y="212" font-family="Segoe UI, sans-serif" font-size="13" fill="#EAF1FF">Criteria scoring</text>
  <text x="330" y="236" font-family="Segoe UI, sans-serif" font-size="13" fill="#EAF1FF">Iterative refinement</text>
  <text x="330" y="266" font-family="monospace" font-size="11" fill="#38D9F0">rank by fit</text>

  <path d="M515 220 L 575 220" stroke="#0B4FD1" stroke-width="2" marker-end="url(#ar)"/>

  <text x="590" y="70" font-family="monospace" font-size="12" fill="#59647D">PRIORITISED</text>
  <rect x="590" y="90" width="140" height="34" rx="8" fill="url(#fg)"/>
  <text x="606" y="112" font-family="monospace" font-size="11" fill="#FFFFFF">HIGH FIT</text>
  <rect x="590" y="132" width="140" height="34" rx="8" fill="url(#fg)" opacity="0.7"/>
  <rect x="590" y="174" width="140" height="34" rx="8" fill="url(#fg)" opacity="0.45"/>
  <rect x="590" y="216" width="140" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F5"/>
  <rect x="590" y="258" width="140" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F5"/>

  <text x="70" y="420" font-family="monospace" font-size="12" fill="#0B4FD1">Accelerated partner prospecting for the MIS Student Advisory Board</text>
</svg>
